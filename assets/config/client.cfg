

[engine]

backend = sfml

asset_manifest = assets/config/assets.cfg

preload_assets = true

quit_action = quit

mute_action = toggle_mute

clear_color = 0 0 0 255

max_frame_time = 0.25

start_scene = title

[window]
title = R-Type Client
width = 1920
height = 1080

framerate = 60
vsync = false

[input]

quit = Escape
move_up = Up Z
move_down = Down S
move_left = Left Q
move_right = Right D
shoot = Space
toggle_mute = M
start = Enter Space
menu = Enter
toggle_debug = F3
menu_prev = Left Q
menu_next = Right D
back = Backspace

[audio]

enabled = true
muted = false

master_volume = 100
music_volume = 60
sfx_volume = 80

[network]
host = 127.0.0.1
port = 4242

interpolation_speed = 15

connect_timeout = 5

[game]

player_asset_prefix = player_
player_variants = 4
max_players = 4

first_player_id = 1
player_z = 10

music = music_stage
boss_music = music_boss
join_sound = sfx_player_join
leave_sound = sfx_player_leave
player_hit_sound = sfx_hit
player_death_sound = sfx_explosion
player_heal_sound = sfx_heal
game_over_sound = sfx_game_over
menu_action = menu
menu_scene = title

hit_flash_color = 255 80 80
hit_flash_duration = 0.15
player_tag_text = P{player}
player_tag_size = 10
player_tag_offset = 17 -2
player_tag_outline = 2

[difficulty]

levels = easy normal hard
default = normal
label_easy = Easy
label_normal = Normal
label_hard = Hard
color_easy = 120 230 140
color_normal = 120 200 255
color_hard = 255 120 120

[skins]
list = cyan magenta green red blue
default = cyan

[skin:cyan]
label = Azure
asset = ship_cyan
color = 90 220 240

[skin:magenta]
label = Orchid
asset = ship_magenta
color = 230 110 230

[skin:green]
label = Viper
asset = ship_green
color = 110 230 120

[skin:red]
label = Ember
asset = ship_red
color = 240 110 100

[skin:blue]
label = Cobalt
asset = ship_blue
color = 110 140 250

[skin_select]
font = font_hud
title_text = Choose your ship
title_size = 32
title_y = 0.2
carousel_y = 0.45
spacing = 0.16
selected_scale = 4
other_scale = 2
other_alpha = 110
label_text = < {skin} >
label_size = 20
label_y = 0.62
hint_text = {prev} - {next}   {start} to play   {back} to go back
hint_size = 12
hint_y = 0.85
dim_color = 170 170 190
outline_thickness = 2
prev_action = menu_prev
next_action = menu_next
start_action = start
back_action = back
next_scene = game
previous_scene = title
change_sound = sfx_player_join
confirm_sound = sfx_pickup
back_sound = sfx_player_leave

[entity_types]

1 = bydos_slave
2 = player_missile
3 = enemy_missile
4 = pickup_double_shot
5 = pickup_triple_shot
6 = pickup_heal
7 = pickup_damage
8 = player_missile_heavy
9 = boss_mecha
10 = boss_mecha_shot

[entity:bydos_slave]
asset = enemy
z = 5

interpolation_speed = 15
hit_sound = sfx_hit
destroy_sound = sfx_explosion

[entity:player_missile]
asset = missile
z = 6
interpolation_speed = 25
spawn_sound = sfx_shoot

[entity:enemy_missile]
asset = missile_enemy
z = 6
interpolation_speed = 25

[entity:player_missile_heavy]
asset = missile_heavy
z = 6
interpolation_speed = 25
spawn_sound = sfx_shoot

[entity:boss_mecha]
asset = boss_mecha
boss = true
label = Green Mecha
color = 140 230 150
scale = 4
z = 3
interpolation_speed = 10
hit_sound = sfx_hit
destroy_sound = sfx_explosion

[entity:boss_mecha_shot]
asset = boss_mecha_shot
z = 6
interpolation_speed = 25

[entity:pickup_double_shot]
asset = pickup_double_shot
z = 4
interpolation_speed = 15

[entity:pickup_triple_shot]
asset = pickup_triple_shot
z = 4
interpolation_speed = 15

[entity:pickup_heal]
asset = pickup_heal
z = 4
interpolation_speed = 15

[entity:pickup_damage]
asset = pickup_damage
z = 4
interpolation_speed = 15

[augments]

1 = double_shot
2 = triple_shot
3 = damage_up

[augment:double_shot]
label = Double shot
color = 74 168 255
gain_sound = sfx_pickup
end_sound = sfx_powerdown

[augment:triple_shot]
label = Triple shot
color = 192 112 255
gain_sound = sfx_pickup
end_sound = sfx_powerdown

[augment:damage_up]
label = Damage
color = 255 154 48
gain_sound = sfx_pickup
end_sound = sfx_powerdown

[floating_text]

text_size = 14
rise_speed = 40
duration = 1.2

fade_portion = 0.5
offset_x = 16
offset_y = -12
outline_thickness = 2
z = 200
heal_color = 120 255 140

heal_text = +{amount} HP

augment_text = {label}!

[hud]
font = font_hud
text_size = 16

scale = 1.0
color = 255 255 255

outline_color = 0 0 0
outline_thickness = 2
margin = 24

notification_duration = 3

line_spacing = 1.8
notification_top = 2

connecting_text = Connecting to {host}:{port}...
connected_text = Connected - Player {player}
timeout_text = No answer from {host}:{port}
players_text = Players {count}/{max}
joined_text = Player {player} joined
left_text = Player {player} left the game
player_destroyed_text = Player {player} was destroyed

difficulty_hud_text = {difficulty}
augments_top = 2.4
augment_text = {label}  {time}s
augment_stacked_text = {label} x{level}  {time}s
augment_permanent_text = {label} x{level}
health_text = HP {hp}/{max}
health_bar_asset = ui_pixel
health_bar_size = 240 12

health_bar_top = 1.2
health_bar_back_color = 40 40 60 200
health_color_high = 90 220 120
health_color_low = 230 70 70

health_low_threshold = 0.3

score_text = SCORE {score}
score_digits = 7
score_color = 255 207 63

boss_text = {boss}  {hp}/{max}
boss_warning_text = WARNING - {boss} approaching
boss_defeated_text = {boss} destroyed
boss_bar_size = 600 14
boss_bar_color = 230 70 70

big_text_size = 48
destroyed_text = DESTROYED
destroyed_hint_text = Press {menu} for the menu, {keys} to quit
destroyed_color = 255 90 90

[title]
font = font_hud

title_y = 0.18
subtitle_spacing = 1.3
difficulty_y = 0.38
prompt_y = 0.50
controls_y = 0.60
line_spacing = 1.8
server_y = 0.94
outline_thickness = 2
title_text = R-TYPE
title_size = 72
title_color = 255 255 255
subtitle_text = A game engine that roars
subtitle_size = 14
accent_color = 120 200 255
dim_color = 170 170 190

prompt_text = Press {keys} to choose your ship
prompt_size = 20

prompt_blink_period = 1.2
start_action = start
next_scene = skin
music = music_stage
start_sound = sfx_player_join
server_text = Server {host}:{port}

difficulty_text = Difficulty  < {difficulty} >
difficulty_size = 18
difficulty_hint_text = {prev} - {next}
difficulty_hint_size = 12
difficulty_prev_action = menu_prev
difficulty_next_action = menu_next
difficulty_sound = sfx_player_join

controls_title = Controls
controls_size = 14
control_line = {label}  {keys}
controls = move_up move_down move_left move_right shoot toggle_mute toggle_debug quit
label_move_up = Up
label_move_down = Down
label_move_left = Left
label_move_right = Right
label_shoot = Shoot
label_toggle_mute = Mute
label_toggle_debug = Debug info
label_quit = Quit

[debug]


font = font_hud
text_size = 12
color = 120 255 120
toggle_action = toggle_debug
visible = false
refresh = 0.25
outline_thickness = 2
z_index = 1000
text = FPS {fps}  {ms} ms  {sprites} sprites  {texts} texts

[starfield]
star_asset = star
star_count = 150
star_z = -20

layer_speeds = 40 100 220
layer_scales = 1 2 3
layer_alphas = 110 180 255

planet_asset = planet
planet_count = 3
planet_z = -30
planet_base_speed = 12
planet_speed_step = 8
planet_base_scale = 1.5
planet_scale_step = 1
planet_alpha = 90


wrap_margin = 300

seed = 0
