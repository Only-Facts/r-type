# R-Type client configuration.
# Every value has a default in the code: delete a line to go back to the default.

[engine]
# Rendering/input/network backend (only "sfml" for now).
backend = sfml
# Asset manifest: logical id -> file, rect, scale, tint, animation.
asset_manifest = assets/config/assets.cfg
# Load every texture, font and sound at startup instead of on first use.
preload_assets = true
# Action (see [input]) that closes the client.
quit_action = quit
# Action (see [input]) that mutes / unmutes all sound.
mute_action = toggle_mute
clear_color = 0 0 0 255
# Biggest frame delta in seconds (avoids jumps after a freeze).
max_frame_time = 0.25
# First scene shown: title or game.
start_scene = title

[window]
title = R-Type Client
width = 1920
height = 1080
# 0 = unlimited. Ignored when vsync is on.
framerate = 60
vsync = false

[input]
# action = key [key...]  -  names: Up Down Left Right Space Escape Enter A..Z
# Several keys per action: arrows + ZQSD (AZERTY) by default.
quit = Escape
move_up = Up Z
move_down = Down S
move_left = Left Q
move_right = Right D
shoot = Space
toggle_mute = M
start = Enter Space
toggle_debug = F3
menu_prev = Left Q
menu_next = Right D

[audio]
# Set enabled = false on machines without an audio device.
enabled = true
muted = false
# Volumes in [0, 100]. Final volume = asset volume x master x music/sfx.
master_volume = 100
music_volume = 60
sfx_volume = 80

[network]
host = 127.0.0.1
port = 4242
# How fast remote entities catch up with the server position (higher = snappier).
interpolation_speed = 15
# Seconds before the HUD reports that the server does not answer (0 = never).
connect_timeout = 5

[game]
# Player assets are "<prefix><n>", n in [1, player_variants] (one look per player).
player_asset_prefix = player_
player_variants = 4
max_players = 4
# Network id of the first player the server creates (shown as "Player 1").
first_player_id = 1
player_z = 10
# Sound and music asset ids (see assets.cfg). Leave empty for silence.
music = music_stage
join_sound = sfx_player_join
leave_sound = sfx_player_leave
player_hit_sound = sfx_hit
player_death_sound = sfx_explosion
player_heal_sound = sfx_heal
game_over_sound = sfx_game_over
# Red flash on any entity that loses health (duration 0 = no flash).
hit_flash_color = 255 80 80
hit_flash_duration = 0.15

[difficulty]
# Levels shown on the title screen, in order. The position (0, 1, 2...) is the value
# sent to the server in ConnectReq; the server decides and confirms it in ConnectAck.
levels = easy normal hard
default = normal
label_easy = Easy
label_normal = Normal
label_hard = Hard
color_easy = 120 230 140
color_normal = 120 200 255
color_hard = 255 120 120

[entity_types]
# Network entity type id (sent by the server in SpawnEntity, see
# docs/protocol-extension.md) -> [entity:<name>] profile. 0 is reserved for players.
1 = bydos_slave
2 = player_missile
3 = enemy_missile
4 = pickup_double_shot
5 = pickup_triple_shot
6 = pickup_heal
7 = pickup_damage
8 = player_missile_heavy

[entity:bydos_slave]
asset = enemy
z = 5
# Smoothing toward the server position (higher = snappier, 0 = snap).
interpolation_speed = 15
hit_sound = sfx_hit
destroy_sound = sfx_explosion

[entity:player_missile]
asset = missile
z = 6
interpolation_speed = 25
spawn_sound = sfx_shoot

[entity:enemy_missile]
asset = missile_enemy
z = 6
interpolation_speed = 25

[entity:player_missile_heavy]
asset = missile_heavy
z = 6
interpolation_speed = 25
spawn_sound = sfx_shoot

# Bonuses floating on screen. The server decides when they appear and what they do;
# the client only shows them. Their effect is announced by AugmentUpdate / HealthUpdate.
[entity:pickup_double_shot]
asset = pickup_double_shot
z = 4
interpolation_speed = 15

[entity:pickup_triple_shot]
asset = pickup_triple_shot
z = 4
interpolation_speed = 15

[entity:pickup_heal]
asset = pickup_heal
z = 4
interpolation_speed = 15

[entity:pickup_damage]
asset = pickup_damage
z = 4
interpolation_speed = 15

[augments]
# Augment id (sent by the server in AugmentUpdate, see docs/protocol-extension.md)
# -> [augment:<name>] profile: label shown in the HUD, color, sounds.
1 = double_shot
2 = triple_shot
3 = damage_up

[augment:double_shot]
label = Double shot
color = 74 168 255
gain_sound = sfx_pickup
end_sound = sfx_powerdown

[augment:triple_shot]
label = Triple shot
color = 192 112 255
gain_sound = sfx_pickup
end_sound = sfx_powerdown

[augment:damage_up]
label = Damage
color = 255 154 48
gain_sound = sfx_pickup
end_sound = sfx_powerdown

[floating_text]
# Texts that rise and fade above a ship: heals and bonuses picked up.
text_size = 14
rise_speed = 40
duration = 1.2
# Share of the duration spent fading out at the end (1 = fades the whole time).
fade_portion = 0.5
offset_x = 16
offset_y = -12
outline_thickness = 2
z = 200
heal_color = 120 255 140
# {amount} = health regained.
heal_text = +{amount} HP
# {label} = augment label from [augment:<name>].
augment_text = {label}!

[hud]
font = font_hud
text_size = 16
# Accessibility: multiplies every HUD text size (1.5 = 50% bigger).
scale = 1.0
color = 255 255 255
# Dark outline keeps texts readable over the star-field (0 = no outline).
outline_color = 0 0 0
outline_thickness = 2
margin = 24
# Seconds a notification stays on screen.
notification_duration = 3
# Notification line height (x text size) and first line position (in lines below the top).
line_spacing = 1.8
notification_top = 2
# Texts, with {placeholders}. Translate freely (UTF-8).
connecting_text = Connecting to {host}:{port}...
connected_text = Connected - Player {player}
timeout_text = No answer from {host}:{port}
players_text = Players {count}/{max}
joined_text = Player {player} joined
left_text = Player {player} left the game
player_destroyed_text = Player {player} was destroyed
# Difficulty confirmed by the server, under the players count (hidden if the server does not send it).
difficulty_hud_text = {difficulty}
# Active augments of the local player, under the health bar (in lines below the top).
augments_top = 2.4
augment_text = {label}  {time}s
augment_stacked_text = {label} x{level}  {time}s
augment_permanent_text = {label} x{level}
# Health bar of the local player: number AND color, so it does not rely on color alone.
health_text = HP {hp}/{max}
health_bar_asset = ui_pixel
health_bar_size = 240 12
# In lines below the status line.
health_bar_top = 1.2
health_bar_back_color = 40 40 60 200
health_color_high = 90 220 120
health_color_low = 230 70 70
# Bar turns to health_color_low at or under this ratio.
health_low_threshold = 0.3
# Shown when the local player dies. {keys} = keys of [engine] quit_action.
big_text_size = 48
destroyed_text = DESTROYED
destroyed_hint_text = Press {keys} to quit
destroyed_color = 255 90 90

[title]
font = font_hud
# Layout: *_y = fraction of the window height, spacings = multiples of the text size.
title_y = 0.18
subtitle_spacing = 1.3
difficulty_y = 0.38
prompt_y = 0.50
controls_y = 0.60
line_spacing = 1.8
server_y = 0.94
outline_thickness = 2
title_text = R-TYPE
title_size = 72
title_color = 255 255 255
subtitle_text = A game engine that roars
subtitle_size = 14
accent_color = 120 200 255
dim_color = 170 170 190
# {keys} = keys bound to start_action in [input].
prompt_text = Press {keys} to start
prompt_size = 20
# Seconds per blink cycle (0 = no blinking, e.g. for photosensitive players).
prompt_blink_period = 1.2
start_action = start
next_scene = game
music = music_stage
start_sound = sfx_player_join
server_text = Server {host}:{port}
# Difficulty selector: {difficulty} = label from [difficulty], {prev} / {next} = keys.
difficulty_text = Difficulty  < {difficulty} >
difficulty_size = 18
difficulty_hint_text = {prev} - {next}
difficulty_hint_size = 12
difficulty_prev_action = menu_prev
difficulty_next_action = menu_next
difficulty_sound = sfx_player_join
# Controls list: actions from [input], in display order, with their labels.
controls_title = Controls
controls_size = 14
control_line = {label}  {keys}
controls = move_up move_down move_left move_right shoot toggle_mute toggle_debug quit
label_move_up = Up
label_move_down = Down
label_move_left = Left
label_move_right = Right
label_shoot = Shoot
label_toggle_mute = Mute
label_toggle_debug = Debug info
label_quit = Quit

[debug]
# Developer overlay: FPS, frame time, drawn sprites/texts. Remove "font" to disable it.
# Its visibility is kept across scenes.
font = font_hud
text_size = 12
color = 120 255 120
toggle_action = toggle_debug
visible = false
refresh = 0.25
outline_thickness = 2
z_index = 1000
text = FPS {fps}  {ms} ms  {sprites} sprites  {texts} texts

[starfield]
star_asset = star
star_count = 150
star_z = -20
# One value per depth layer: far -> near.
layer_speeds = 40 100 220
layer_scales = 1 2 3
layer_alphas = 110 180 255

planet_asset = planet
planet_count = 3
planet_z = -30
planet_base_speed = 12
planet_speed_step = 8
planet_base_scale = 1.5
planet_scale_step = 1
planet_alpha = 90

# Distance outside the screen before an element wraps to the other side.
wrap_margin = 300
# 0 = different sky each launch, any other value = always the same sky.
seed = 0
