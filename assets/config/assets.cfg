# Asset manifest. One [section] per asset, the section name is the id the game asks for.
#
#   path       = file, relative to the working directory          (required)
#   rect       = left top width height  -  first frame in a sheet  (default: whole image)
#   scale      = s  or  sx sy                                      (default: 1)
#   tint       = r g b [a]                                         (default: 255 255 255 255)
#   frames     = number of frames, laid out horizontally           (default: 1)
#   frame_time = seconds per frame                                 (default: 0.1)
#   loop       = true / false                                      (default: true)
#
#   type       = texture | font | sound | music                    (default: texture)
#   volume     = [0, 100], for sound and music                     (default: 100)
#   pitch      = playback speed, for sound                         (default: 1)

[star]
path = assets/star.png

[planet]
path = assets/planet.png

# Players: same sprite, one tint each, so the 4 players are distinguishable.
[player_1]
path = assets/player.png
tint = 255 255 255

[player_2]
path = assets/player.png
tint = 255 130 130

[player_3]
path = assets/player.png
tint = 130 255 140

[player_4]
path = assets/player.png
tint = 130 170 255

[enemy]
path = assets/enemy.png

[missile]
path = assets/missile.png

[missile_enemy]
path = assets/missile.png
tint = 255 110 110

# Fonts
[font_hud]
type = font
path = assets/fonts/PressStart2P-Regular.ttf

# Music (streamed from disk)
[music_stage]
type = music
path = assets/sounds/music.wav
volume = 100
loop = true

# Sound effects
[sfx_player_join]
type = sound
path = assets/sounds/join.wav
volume = 70

[sfx_player_leave]
type = sound
path = assets/sounds/leave.wav
volume = 70

[sfx_shoot]
type = sound
path = assets/sounds/shoot.wav
volume = 50

[sfx_explosion]
type = sound
path = assets/sounds/explosion.wav
volume = 80
