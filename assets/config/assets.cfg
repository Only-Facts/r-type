# Asset manifest. One [section] per asset, the section name is the id the game asks for.
#
#   path       = file, relative to the working directory          (required)
#   rect       = left top width height  -  first frame in a sheet  (default: whole image)
#   scale      = s  or  sx sy                                      (default: 1)
#   tint       = r g b [a]                                         (default: 255 255 255 255)
#   frames     = number of frames, laid out horizontally           (default: 1)
#   frame_time = seconds per frame                                 (default: 0.1)
#   loop       = true / false                                      (default: true)
#
#   type       = texture | font | sound | music                    (default: texture)
#   volume     = [0, 100], for sound and music                     (default: 100)
#   pitch      = playback speed, for sound                         (default: 1)

[star]
path = assets/star.png

[planet]
path = assets/planet.png

# Players: same sprite, one tint each, so the 4 players are distinguishable.
[player_1]
path = assets/player.png
tint = 255 255 255

[player_2]
path = assets/player.png
tint = 255 130 130

[player_3]
path = assets/player.png
tint = 130 255 140

[player_4]
path = assets/player.png
tint = 130 170 255

[enemy]
path = assets/enemy.png

[missile]
path = assets/missile.png

[missile_heavy]
path = assets/missile_heavy.png

# Bonuses: 2-frame sheets (normal / glowing), 28x28 per frame.
[pickup_double_shot]
path = assets/pickups/double_shot.png
rect = 0 0 28 28
frames = 2
frame_time = 0.25

[pickup_triple_shot]
path = assets/pickups/triple_shot.png
rect = 0 0 28 28
frames = 2
frame_time = 0.25

[pickup_heal]
path = assets/pickups/heal.png
rect = 0 0 28 28
frames = 2
frame_time = 0.25

[pickup_damage]
path = assets/pickups/damage.png
rect = 0 0 28 28
frames = 2
frame_time = 0.25

[missile_enemy]
path = assets/missile.png
tint = 255 110 110

# UI: 1x1 white pixel, scaled and tinted for bars
[ui_pixel]
path = assets/ui/pixel.png

# Fonts
[font_hud]
type = font
path = assets/fonts/PressStart2P-Regular.ttf

# Music (streamed from disk)
[music_stage]
type = music
path = assets/sounds/music.wav
volume = 100
loop = true

# Sound effects
[sfx_player_join]
type = sound
path = assets/sounds/join.wav
volume = 70

[sfx_player_leave]
type = sound
path = assets/sounds/leave.wav
volume = 70

[sfx_shoot]
type = sound
path = assets/sounds/shoot.wav
volume = 50

[sfx_explosion]
type = sound
path = assets/sounds/explosion.wav
volume = 80

[sfx_hit]
type = sound
path = assets/sounds/hit.wav
volume = 80

[sfx_game_over]
type = sound
path = assets/sounds/game_over.wav
volume = 80

[sfx_pickup]
type = sound
path = assets/sounds/pickup.wav
volume = 80

[sfx_heal]
type = sound
path = assets/sounds/heal.wav
volume = 80

[sfx_powerdown]
type = sound
path = assets/sounds/powerdown.wav
volume = 70
